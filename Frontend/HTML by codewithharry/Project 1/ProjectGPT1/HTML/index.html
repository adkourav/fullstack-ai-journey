
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">6

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Order delicious food online. Discover restaurants, cuisines and dishes near you.">

    <title>Zomato - Order Food Online</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>


<body>

    <!-- ================= HEADER ================= -->

    <header>

        <div class="logo">
            <img src="img/Zomato.png" alt="Zomato Logo">
        </div>


        <nav>
            <ul>

                <li>
                    <a href="#investor">Investor Relations</a>
                </li>

                <li>
                    <a href="#restaurant">Add Restaurant</a>
                </li>

                <li>
                    <a href="#login">Login</a>
                </li>

                <li>
                    <a href="#signup">Signup</a>
                </li>

            </ul>
        </nav>

    </header>


    <!-- ================= MAIN ================= -->

    <main>

        <section class="hero">

            <img
                class="hero-logo"
                src="img/logo.png"
                alt="Zomato">


            <h1>
                Better food for
                <br>
                more people
            </h1>


            <p>
                For over a decade, we've enabled our customers
                to discover new tastes, delivered right to their doorstep.
            </p>


            <!-- Search Box -->

            <div class="search-box">

                <span class="location-icon">📍</span>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search for restaurant, cuisine or a dish"
                    autocomplete="off">

                <button id="searchButton">
                    Search
                </button>

            </div>


            <!-- Search Suggestions -->

            <div id="suggestions" class="suggestions"></div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            Copyright &copy; 2026 Zomato | All Rights Reserved
        </p>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="js/style.js"></script>

</body>

</html>
