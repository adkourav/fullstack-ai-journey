<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        

        /* ================================
   General / Body
================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #fff5f5;
            color: #333;
        }

        /* ================================
   Header
================================ */
        header {
            background-color: #e23744;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
        }

        /* Zomato Logo / Name */
        header>div:first-child {
            font-size: 28px;
            font-weight: bold;
        }

        /* Navigation */
        header a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            margin-left: 25px;
            transition: 0.3s;
        }

        /* Navigation Hover */
        header a:hover {
            color: #ffd6d9;
            text-decoration: underline;
        }

        /* ================================
   Main Section
================================ */
        main {
            min-height: 75vh;
            text-align: center;
            padding: 100px 20px;
        }

        /* Main Heading */
        main>div {
            font-size: 42px;
            font-weight: bold;
            color: #e23744;
            margin-bottom: 25px;
        }

        /* Paragraph */
        main p {
            max-width: 700px;
            margin: auto;
            font-size: 18px;
            line-height: 1.7;
            color: #555;
        }

        /* ================================
   Footer
================================ */
        footer {
            background-color: #e23744;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        /* ================================
   Responsive Design
================================ */
        @media (max-width: 600px) {

            header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            header a {
                margin: 0 8px;
                font-size: 14px;
            }

            main {
                padding: 70px 20px;
            }

            main>div {
                font-size: 30px;
            }

            main p {
                font-size: 16px;
            }
        }

        
    </style>
    <title>Zomato - deliver food at your doorstep</title>
</head>

<body>
    <header>
        <div>Zometo</div>
        <div>
            <a href="/home">Home</a>
            <a href="/about us ">Abour us </a>
            <a href="/contact">Contact</a>
        </div>

    </header>

    <main>
        <div>
            order food anytime, anywhere
        </div>
        <p>
            India's #1 food delivery app. Experience fast & easy online ordering on the Zomato app. Order on app. Better
            food for more people. For over a decade, we ..
        </p>
    </main>

    <footer>
        Copyright Zomato All right reserved
    </footer>



</body>

</html>
