<!-- 3. Use <br> and <hr> tags to display a piece of text with line breaks. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>use <br> and <hr> </title>
</head>
<body>
    <h2>use br tag for the line change </h2>
    <br>
    <P> line after the br tag </P>

    <hr>
    <p> line after the hr tag </p>
    
</body>
</html>
